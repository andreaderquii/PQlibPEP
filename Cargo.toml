[package]
name = "pq-libpep"
edition = "2021"
version = "0.1.0"

authors = [
    "Andrea Derqui", "<andrea.derqui@ru.nl>"
]

description = "Post-Quantum Library for polymorphic encryption and pseudonymization (RLWE)"
license = "Apache-2.0"

[lib]
name = "pq_libpep"
crate-type = ["cdylib", "rlib"]
path = "src/lib/lib.rs"

[dependencies]
rand_core = "0.6"
rand = "0.8"
sha3 = "0.10"

concrete-ntt = "0.2.0"
nc-polynomial = "0.2.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[lints.rust]
unsafe_code = "deny"

